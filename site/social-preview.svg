      AirPods Recovery Kit
    </text>
  </g>

  <g transform="translate(76 164)">
    <circle cx="7" cy="7" r="7" fill="#14775e" opacity=".16" />
    <circle cx="7" cy="7" r="3.5" fill="#14775e" />
    <text
      x="24"
      y="12"
      fill="#60716a"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15"
      font-weight="700"
      letter-spacing="2"
    >
      PRIVATE BROWSER AUDIO TEST
    </text>
  </g>

  <text
    x="76"
    y="236"
    fill="#17221e"
    font-family="Arial, Helvetica, sans-serif"
    font-size="62"
    font-weight="700"
    letter-spacing="-3"
  >
    <tspan x="76" dy="0">Help wet, damaged,</tspan>
    <tspan x="76" dy="68">or quiet AirPods.</tspan>
  </text>

  <text
    x="78"
    y="393"
    fill="#60716a"
    font-family="Arial, Helvetica, sans-serif"
