<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">AirPods Recovery Kit</title>
  <desc id="description">
    A private browser test for wet, damaged, quiet, or distorted AirPods.
  </desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf8" />
      <stop offset="1" stop-color="#e7f2ef" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#9bd8e9" stop-opacity=".45" />
      <stop offset="1" stop-color="#9bd8e9" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="18"
        flood-color="#173d32"
        flood-opacity=".16"
      />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <circle cx="920" cy="210" r="310" fill="url(#glow)" />
  <circle cx="140" cy="560" r="250" fill="#dcece7" opacity=".55" />

  <g transform="translate(76 66)">
    <rect
      width="18"
      height="27"
      rx="9"
      fill="none"
      stroke="#17221e"
      stroke-width="3"
    />
    <text
      x="34"
      y="21"
      fill="#17221e"
      font-family="Arial, Helvetica, sans-serif"
      font-size="23"
      font-weight="700"
