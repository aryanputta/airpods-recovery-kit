    <g transform="translate(293 291)">
      <circle cx="30" cy="30" r="27" fill="#f7faf8" stroke="#d9e5e1" stroke-width="5" />
      <text
        x="30"
        y="27"
        fill="#60716a"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10"
        font-weight="700"
