      <rect x="49" y="80" width="42" height="96" rx="21" fill="#edf3f1" stroke="#bdd1c9" stroke-width="4" />
      <ellipse cx="70" cy="56" rx="32" ry="25" fill="#17221e" />
      <ellipse cx="70" cy="56" rx="22" ry="17" fill="#091512" />
    </g>

    <g transform="translate(226 105)">
      <ellipse cx="70" cy="56" rx="58" ry="52" fill="#f5f8f7" stroke="#bdd1c9" stroke-width="4" />
      <rect x="49" y="80" width="42" height="96" rx="21" fill="#edf3f1" stroke="#bdd1c9" stroke-width="4" />
      <ellipse cx="70" cy="56" rx="32" ry="25" fill="#17221e" />
      <ellipse cx="70" cy="56" rx="22" ry="17" fill="#091512" />
    </g>

    <path
      d="M195 119 C195 119 178 143 178 158 C178 169 186 177 195 177 C204 177 212 169 212 158 C212 143 195 119 195 119 Z"
