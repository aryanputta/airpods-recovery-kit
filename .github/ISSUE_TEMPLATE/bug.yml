name: Bug report
description: Report a reproducible browser, macOS, audio, or accessibility problem.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include a personal AirPods name, Bluetooth address, pairing dump, username, local path, credential, or environment file.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Website
        - macOS terminal
        - Codex skill
        - Documentation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, or macOS version. Keep device identity private.
      placeholder: "Safari 20 on macOS 26"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the exact generic error text and the smallest reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal device identifiers, local paths, and credentials.
          required: true
